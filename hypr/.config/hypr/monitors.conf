# ACTIVE LAYOUT — TV on top, laptop below (vertical stack)
# 11.11.2026
#
# Laptop is the anchor at 0x0, so when the TV is unplugged nothing
# shifts and there's no dead band above it. The TV hangs ABOVE it at
# y = -768 (its own height). Negative y is fine; the point is that the
# two edges TOUCH. If they don't, the pointer has nowhere to cross and
# the monitors look like two separate islands.
#
# Both panels run native 768p. The Samsung is 1360x768 native — feeding
# it 1920x1080 makes the panel downscale internally and that's the
# "pixel-scratchy" look. `preferred` resolves to 1360x768 here.
#
# Flip it (laptop on top) by moving the laptop to 0x-768 and the TV to
# 0x0 — swap the two `0x...` values, change nothing else.
# ─────────────────────────────────────────────────────────────────────

# BOTTOM — laptop panel, the anchor
monitor=eDP-1,1366x768@60.06,0x0,1.0

# TOP — Samsung TV. Port name first, desc second: if the kernel ever
# renames HDMI-A-1 the desc rule still catches it.
# desc: = make + model + serial, space separated (serial is empty here).
monitor=HDMI-A-1,preferred,0x-768,1.0
monitor=desc:Samsung Electric Company SAMSUNG,preferred,0x-768,1.0

# Any other external screen: native res, Hyprland picks a free spot.
monitor=,preferred,auto,1.0

